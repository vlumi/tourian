[project]
name = "tourian-arm"
version = "0.0.0"
description = "A physical arm behind the tourian contract, through the arm's own driver"
requires-python = ">=3.12"
dependencies = ["websockets>=14", "protobuf>=5.29"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]

[project.scripts]
tourian-arm = "tourian_arm.__main__:main"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tourian_arm*"]

[tool.pytest.ini_options]
pythonpath = ["../../gen/python", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["../../gen"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["tourian", "tourian_arm"]
