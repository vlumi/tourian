syntax = "proto3";

package tourian.v1;

import "tourian/v1/config.proto";
import "tourian/v1/control.proto";
import "tourian/v1/episode.proto";
import "tourian/v1/robot.proto";
import "tourian/v1/video.proto";

// One contract message as it crosses a transport; every frame on the wire is one of these.
message Envelope {
  oneof message {
    Capabilities capabilities = 1;
    VelocityCommand velocity_command = 2;
    CommandAck command_ack = 3;
    Observation observation = 4;
    Heartbeat heartbeat = 5;
    Stop stop = 6;
    CameraAnnounce camera_announce = 7;
    VideoRequest video_request = 8;
    SessionDescription session_description = 9;
    IceCandidate ice_candidate = 10;
    VideoFrame video_frame = 11;
    RecordRequest record_request = 12;
    EpisodeStatus episode_status = 13;
    EpisodeFlag episode_flag = 14;
    ControlState control_state = 15;
    ControlRequest control_request = 16;
    RobotConfig robot_config = 17;
  }
}
