version: v2
clean: true
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/vlumi/tourian/gen/go
  disable:
    - file_option: go_package_prefix
      module: buf.build/protocolbuffers/wellknowntypes
plugins:
  - local: protoc-gen-go
    out: ../gen/go
    opt: paths=source_relative
  - local: ../node_modules/.bin/protoc-gen-es
    out: ../gen/ts
    opt: target=ts
inputs:
  - directory: .
